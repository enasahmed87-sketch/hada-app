<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">سياسة الخصوصية — هَدَأ</title>
<meta name="theme-color" content="#3D2B3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400&family=Tajawal:wght@300;400;500;700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF4EE; --plum:#3D2B3D; --rose:#C97B84; --terracotta:#B5573F;
  --sage:#8A9B7E; --line:#E3D4CB; --gold:#C8956D;
}
*{box-sizing:border-box;}
html,body{overflow-x:hidden;}
body{margin:0;background:var(--cream);color:var(--plum);font-family:'Tajawal','Segoe UI',sans-serif;font-weight:300;line-height:1.8;}
body.lang-en{font-family:'Poppins','Segoe UI',sans-serif;}
h1,h2,h3{font-family:'Aref Ruqaa','Tajawal',serif;font-weight:400;margin:0;}
body.lang-en h1,body.lang-en h2,body.lang-en h3{font-family:'Poppins',sans-serif !important;font-weight:600 !important;}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px;}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:18px;border-bottom:2px solid var(--line);margin-bottom:28px;}
header .brand{display:flex;align-items:center;gap:10px;}
header .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--terracotta);}
header h1{font-size:22px;color:var(--plum);}
header .tag{font-size:12px;color:var(--rose);margin-top:2px;}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.lang-toggle{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--plum);}
.lang-toggle:hover{background:var(--cream);}
.backLink{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--plum);text-decoration:none;display:inline-block;}
.backLink:hover{background:var(--cream);}
.page-title{font-size:26px;margin-bottom:6px;}
.page-sub{font-size:13.5px;color:#6b5a64;margin-bottom:26px;}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:16px;}
.card h2{font-size:17px;margin-bottom:10px;color:var(--plum);}
.card p{font-size:14px;color:#4a3c44;margin:0 0 10px;}
.card p:last-child{margin-bottom:0;}
.card ul{margin:0 0 10px;padding-inline-start:20px;font-size:14px;color:#4a3c44;}
.card ul:last-child{margin-bottom:0;}
.card li{margin-bottom:6px;}
.card li:last-child{margin-bottom:0;}
.contact-box{background:linear-gradient(135deg,#FBF1EC,#F4ECE3);border:1.5px solid var(--gold);border-radius:16px;padding:18px 20px;margin-bottom:16px;}
.contact-box a{color:var(--terracotta);font-weight:700;text-decoration:none;}
.contact-box a:hover{text-decoration:underline;}
.updated-line{text-align:center;font-size:12px;color:#a89aa0;margin:24px 0;}
.bottom-back{text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>هَدَأ</h1>
        <div class="tag" id="pageTag">سياسة الخصوصية</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle">English</button>
      <a class="backLink" href="/" id="backLinkTop">→ الرجوع للتطبيق</a>
    </div>
  </header>

  <h1 class="page-title" id="pageH1">سياسة الخصوصية</h1>
  <p class="page-sub" id="pageIntroSub">آخر تحديث: <span id="updatedDate"></span></p>

  <div id="sections"></div>

  <div class="contact-box">
    <p id="contactText" style="margin:0;"></p>
  </div>

  <div class="bottom-back">
    <a class="backLink" href="/" id="backLinkBottom">→ الرجوع للتطبيق</a>
  </div>
</div>

<script>
let LANG = localStorage.getItem('hada_lang') || 'ar';

const MONTH_NAMES = {
  ar: ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
  en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
};

const T = {
  pageTitle: { ar:'سياسة الخصوصية — هَدَأ', en:'Privacy Policy — Hada’' },
  pageTag: { ar:'سياسة الخصوصية', en:'Privacy Policy' },
  backLink: { ar:'→ الرجوع للتطبيق', en:'← Back to the app' },
  pageH1: { ar:'سياسة الخصوصية', en:'Privacy Policy' },
  pageIntroSub: { ar:'آخر تحديث: ', en:'Last updated: ' },
  contactText: {
    ar:'للتواصل معنا أو طلب حذف حسابك، راسلينا على: <a href="mailto:support@hadaa-app.com">support@hadaa-app.com</a>',
    en:'To contact us or request account deletion, email us at: <a href="mailto:support@hadaa-app.com">support@hadaa-app.com</a>'
  },
};

const SECTIONS = [
  {
    title: { ar:'مقدمة', en:'Introduction' },
    body: {
      ar:'<p>هَدَأ هو تطبيق يساعد النساء البالغات على تتبع دورتهن الشهرية ومزاجهن اليومي، ويقدّم تحليلات وتوصيات مبنية على الذكاء الاصطناعي. نهتم بخصوصيتك، وهذي السياسة توضح لك أي بيانات نجمعها، وكيف نستخدمها ونحميها.</p>',
      en:'<p>Hada’ is an app that helps adult women track their menstrual cycle and daily mood, and provides AI-based analysis and recommendations. We care about your privacy, and this policy explains what data we collect, how we use it, and how we protect it.</p>',
    }
  },
  {
    title: { ar:'البيانات التي نجمعها', en:'Data We Collect' },
    body: {
      ar:`<ul>
        <li>الاسم والبريد الإلكتروني (للتسجيل والدخول)</li>
        <li>سجلات المزاج والأعراض اليومية</li>
        <li>تواريخ الدورة الشهرية وطولها</li>
        <li>إعدادات تذكيرات الأذكار</li>
      </ul>`,
      en:`<ul>
        <li>Name and email address (for registration and login)</li>
        <li>Daily mood and symptom logs</li>
        <li>Period dates and cycle length</li>
        <li>Dhikr reminder settings</li>
      </ul>`,
    }
  },
  {
    title: { ar:'كيف نستخدم بياناتك', en:'How We Use Your Data' },
    body: {
      ar:`<ul>
        <li>عرض تحليلاتك الشخصية</li>
        <li>توليد تقارير الذكاء الاصطناعي الأسبوعية والشهرية</li>
        <li>تشغيل المحادثة اليومية مع الذكاء الاصطناعي</li>
      </ul>`,
      en:`<ul>
        <li>Showing your personal analytics</li>
        <li>Generating weekly and monthly AI reports</li>
        <li>Powering the daily AI chat</li>
      </ul>`,
    }
  },
  {
    title: { ar:'الأطراف الثالثة التي نستخدمها', en:'Third Parties We Use' },
    body: {
      ar:`<ul>
        <li><b>Anthropic (Claude API)</b>: لتحليل النصوص وتوليد التقارير</li>
        <li><b>Cloudflare</b>: لاستضافة الخادم وقاعدة البيانات</li>
        <li><b>Resend</b>: لإرسال إيميلات إعادة تعيين كلمة المرور</li>
      </ul>`,
      en:`<ul>
        <li><b>Anthropic (Claude API)</b>: to analyze text and generate reports</li>
        <li><b>Cloudflare</b>: to host our server and database</li>
        <li><b>Resend</b>: to send password-reset emails</li>
      </ul>`,
    }
  },
  {
    title: { ar:'خصوصية الذكاء الاصطناعي', en:'AI Privacy' },
    body: {
      ar:`<ul>
        <li>بياناتك تُرسل مشفّرة إلى Anthropic فقط عند طلبك للتحليل (تقرير، محادثة، إلخ)</li>
        <li>بياناتك لا تُستخدم أبدًا لتدريب أي نموذج ذكاء اصطناعي</li>
      </ul>`,
      en:`<ul>
        <li>Your data is sent encrypted to Anthropic only when you request an analysis (report, chat, etc.)</li>
        <li>Your data is never used to train any AI model</li>
      </ul>`,
    }
  },
  {
    title: { ar:'تخزين البيانات', en:'Data Storage' },
    body: {
      ar:'<p>تُخزَّن بياناتك على خوادم Cloudflare (قاعدة بيانات D1) بشكل مشفّر.</p>',
      en:'<p>Your data is stored on Cloudflare servers (D1 database), encrypted.</p>',
    }
  },
  {
    title: { ar:'حذف الحساب', en:'Account Deletion' },
    body: {
      ar:'<p>تقدرين تطلبين حذف حسابك وكل بياناتك بشكل كامل ونهائي في أي وقت، بمراسلتنا على <a href="mailto:support@hadaa-app.com">support@hadaa-app.com</a> من نفس البريد المسجّل في حسابك. بنقوم بحذف بياناتك خلال مدة معقولة من استلام الطلب.</p>',
      en:'<p>You can request a complete and permanent deletion of your account and all your data at any time by emailing us at <a href="mailto:support@hadaa-app.com">support@hadaa-app.com</a> from your registered email address. We will delete your data within a reasonable time after receiving the request.</p>',
    }
  },
  {
    title: { ar:'الفئة المستهدفة', en:'Target Audience' },
    body: {
      ar:'<p>هَدَأ مخصص للنساء البالغات (18 سنة فأكثر) فقط. لا نجمع بيانات مستخدمات دون سن 18 عمدًا.</p>',
      en:'<p>Hada’ is intended for adult women (18 years and older) only. We do not knowingly collect data from users under 18.</p>',
    }
  },
  {
    title: { ar:'تحديثات هذي السياسة', en:'Updates to This Policy' },
    body: {
      ar:'<p>قد نحدّث سياسة الخصوصية هذي بين فترة وأخرى. أي تعديل بينعكس على هذي الصفحة مع تحديث تاريخ "آخر تحديث" بالأعلى.</p>',
      en:'<p>We may update this privacy policy from time to time. Any change will be reflected on this page, along with an updated "last updated" date above.</p>',
    }
  },
];

function renderSections(){
  const wrap = document.getElementById('sections');
  wrap.innerHTML = SECTIONS.map(s => `
    <div class="card">
      <h2>${s.title[LANG]}</h2>
      ${s.body[LANG]}
    </div>
  `).join('');
}

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG==='en' ? 'ltr' : 'rtl';
  document.body.classList.toggle('lang-en', LANG==='en');
  document.getElementById('langToggle').textContent = LANG==='en' ? 'العربية' : 'English';
  document.title = T.pageTitle[LANG];
  document.getElementById('pageTag').textContent = T.pageTag[LANG];
  document.getElementById('backLinkTop').textContent = T.backLink[LANG];
  document.getElementById('backLinkBottom').textContent = T.backLink[LANG];
  document.getElementById('pageH1').textContent = T.pageH1[LANG];
  document.getElementById('contactText').innerHTML = T.contactText[LANG];

  const now = new Date();
  const day = now.getDate();
  const month = MONTH_NAMES[LANG][now.getMonth()];
  const year = now.getFullYear();
  document.getElementById('pageIntroSub').firstChild.textContent = T.pageIntroSub[LANG];
  document.getElementById('updatedDate').textContent = LANG==='en' ? `${month} ${day}, ${year}` : `${day} ${month} ${year}`;

  renderSections();
}

document.getElementById('langToggle').addEventListener('click', ()=>{
  LANG = LANG==='ar' ? 'en' : 'ar';
  localStorage.setItem('hada_lang', LANG);
  applyLang();
});

applyLang();
</script>
</body>
</html>
